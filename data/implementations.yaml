- id: liboqs
  name: liboqs
  kind: library
  homepage: https://openquantumsafe.org/
  repo: open-quantum-safe/liboqs
  release_source:
    type: github_release
    repo: open-quantum-safe/liboqs
  algorithms:
    mlkem:
      status: supported
      since_version: 0.11.0
      evidence_url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.11.0
      verified_on: '2026-11-11'
      note: 'Release note: ML-KEM updated to the final FIPS 203 version. The project says the library
        is for research and prototyping, not production use.'
    mldsa:
      status: supported
      since_version: 0.12.0
      evidence_url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.12.0
      verified_on: '2026-11-11'
      note: 'Release note: ML-DSA updated to the final FIPS 204 version. The project says the library
        is for research and prototyping, not production use.'
    slhdsa:
      status: supported
      since_version: 0.15.0
      evidence_url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.15.0
      verified_on: '2026-11-11'
      note: 'Release note: ''Integrated SLH-DSA implementation''. Release 0.16.0 removes SPHINCS+.'
    hybrid_kex:
      status: experimental
      since_version: null
      evidence_url: https://github.com/open-quantum-safe/liboqs/releases/tag/0.16.0
      verified_on: '2026-11-11'
      note: liboqs is a primitives library. Hybrid TLS comes from the separate oqs-provider, which the
        release notes call a prototype.
- id: botan
  name: Botan
  kind: library
  homepage: https://botan.randombit.net/
  repo: randombit/botan
  release_source:
    type: github_tags
    repo: randombit/botan
    prefix: '3.'
    tag_regex: ^(\d+)\.(\d+)\.(\d+)$
  algorithms:
    mlkem:
      status: supported
      since_version: 3.6.0
      evidence_url: https://github.com/randombit/botan/blob/master/news.rst
      verified_on: '2026-11-11'
      note: 'news.rst, Version 3.6.0 (2024-10-21): ''Add support for FIPS 203 ML-KEM''.'
    mldsa:
      status: supported
      since_version: 3.6.0
      evidence_url: https://github.com/randombit/botan/blob/master/news.rst
      verified_on: '2026-11-11'
      note: 'news.rst, Version 3.6.0 (2024-10-21): ''Add support for FIPS 204 ML-DSA''.'
    slhdsa:
      status: supported
      since_version: 3.6.0
      evidence_url: https://github.com/randombit/botan/blob/master/news.rst
      verified_on: '2026-11-11'
      note: 'news.rst, Version 3.6.0 (2024-10-21): ''Add support for FIPS 205 SLH-DSA''.'
    hybrid_kex:
      status: supported
      since_version: 3.7.0
      evidence_url: https://github.com/randombit/botan/blob/master/news.rst
      verified_on: '2026-11-11'
      note: 'news.rst, Version 3.7.0 (2025-02-04): hybrid x25519/ML-KEM-768 enabled by default in TLS.
        Earlier availability was not checked.'
