  algorithms:
    mlkem:
      status: supported
      since_version: null
      evidence_url: https://github.com/bcgit/bc-java/blob/main/docs/specifications.md
      verified_on: '2026-11-11'
      note: specifications.md lists ML-KEM (FIPS 203) in the BC provider. First version not recorded.
    mldsa:
      status: supported
      since_version: null
      evidence_url: https://github.com/bcgit/bc-java/blob/main/docs/specifications.md
      verified_on: '2026-11-11'
      note: specifications.md lists ML-DSA (FIPS 204) in the BC provider. First version not recorded.
    slhdsa:
      status: supported
      since_version: null
      evidence_url: https://github.com/bcgit/bc-java/blob/main/docs/specifications.md
      verified_on: '2026-11-11'
      note: specifications.md lists SLH-DSA (FIPS 205) in the BC provider. First version not recorded.
    hybrid_kex:
      status: supported
      since_version: null
      evidence_url: https://github.com/bcgit/bc-java/blob/main/docs/specifications.md
      verified_on: '2026-11-11'
      note: 'specifications.md: BCJSSE offers X25519MLKEM768 first by default in TLS 1.3. First version
        not recorded.'
- id: go
  name: Go standard library
  kind: runtime
  homepage: https://go.dev/
  repo: golang/go
  release_source:
    type: github_tags
    repo: golang/go
    prefix: go1.
    tag_regex: ^go(\d+)\.(\d+)(?:\.(\d+))?$
  algorithms:
    mlkem:
      status: supported
      since_version: '1.24'
      evidence_url: https://go.dev/doc/go1.24
      verified_on: '2026-11-11'
      note: 'Go 1.24 notes: new crypto/mlkem package (ML-KEM-768 and ML-KEM-1024).'
    mldsa:
      status: supported
      since_version: '1.27'
      evidence_url: https://go.dev/doc/go1.27
      verified_on: '2026-11-11'
      note: 'Go 1.27 notes: new crypto/mldsa package implementing FIPS 204; ML-DSA in crypto/x509 and
        TLS 1.3.'
    slhdsa:
      status: unverified
      evidence_url: https://go.dev/doc/go1.27
      verified_on: '2026-11-11'
      note: SLH-DSA is not mentioned in the Go 1.24, 1.26 or 1.27 release notes read; absence there is
        not proof of non-support.
    hybrid_kex:
      status: supported
      since_version: '1.24'
      evidence_url: https://go.dev/doc/go1.24
      verified_on: '2026-11-11'
      note: 'Go 1.24 notes: X25519MLKEM768 in crypto/tls, enabled by default. Go 1.26 notes add SecP256r1MLKEM768
        and SecP384r1MLKEM1024 by default.'
- id: openjdk
  name: OpenJDK
  kind: runtime
  homepage: https://openjdk.org/
  repo: openjdk/jdk
  release_source:
    type: github_tags
    repo: openjdk/jdk
    prefix: jdk-
    tag_regex: ^jdk-(\d+)-ga$
  algorithms:
    mlkem:
      status: supported
      since_version: '24'
      evidence_url: https://openjdk.org/jeps/496
      verified_on: '2026-11-11'
      note: JEP 496, status Closed / Delivered, release 24.
    mldsa:
      status: supported
      since_version: '24'
      evidence_url: https://openjdk.org/jeps/497
      verified_on: '2026-11-11'
      note: JEP 497, status Closed / Delivered, release 24.
    slhdsa:
      status: unverified
      verified_on: '2026-11-11'
      note: No JEP or release note for SLH-DSA in the JDK was found in this review.
    hybrid_kex:
      status: supported
      since_version: '27'
      evidence_url: https://openjdk.org/jeps/527
      verified_on: '2026-11-11'
      note: JEP 527, status Closed / Delivered, release 27.
