        TLS 1.3.'
    slhdsa:
      status: planned
      scope: standalone
      evidence_type: issue-tracker
      evidence_strength: stated
      evidence_url: https://github.com/golang/go/issues/64537#issuecomment-2445056004
      verified_on: '2026-11-11'
      note: 'Roadmap issue golang/go#64537, 2024-10-29, by a Go crypto maintainer: ''We plan to start
        with SLH-DSA (FIPS 205)'' and it ''will probably be implemented in Go 1.25 or Go 1.26''. The Go
        1.25 and 1.27 release notes and the Go 1.27 crypto package index do not include it, so that target
        has passed.'
