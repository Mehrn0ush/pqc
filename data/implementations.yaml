# One entry per tracked project. See docs/data.md and CONTRIBUTING.md for the evidence rule.
- id: openssl
  name: OpenSSL
  kind: library
  homepage: https://openssl-library.org/
  repo: openssl/openssl
  release_source:
    type: github_release
    repo: openssl/openssl
  algorithms:
    mlkem:
      status: supported
      scope: standalone
      since_version: 3.5.0
      evidence_type: changelog
      evidence_strength: stated
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'.
    mldsa:
      status: supported
      scope: standalone
      since_version: 3.5.0
      evidence_type: changelog
      evidence_strength: stated
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'; ML-DSA is in the default TLS signature algorithms.
    slhdsa:
      status: supported
      scope: standalone
      since_version: 3.5.0
      evidence_type: changelog
      evidence_strength: stated
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'.
    hybrid_kex:
      status: supported
      since_version: 3.5.0
      evidence_type: changelog
      evidence_strength: stated
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: X25519MLKEM768, SecP256r1MLKEM768 and SecP384r1MLKEM1024 TLS groups; X25519MLKEM768 first
        in the default group list.
- id: boringssl
  name: BoringSSL
  kind: library
  homepage: https://boringssl.googlesource.com/boringssl/
  repo: google/boringssl
  release_source:
    type: github_release
    repo: google/boringssl
  algorithms:
    mlkem:
      status: experimental
      scope: standalone
      since_version: null
      since_note: BoringSSL tags are date-based and its GitHub releases carry no release notes, so no
        first version can be stated.
      evidence_type: source-code
      evidence_strength: inferred
      strength_reason: mlkem.h says it implements FIPS 203 but states no support level; the README promises
        no API or ABI stability.
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/mlkem.h
      verified_on: '2026-11-11'
      note: 'Read in header: "This implements the Module-Lattice-Based Key-Encapsulation Mechanism". Also
        MLKEM1024 is an SSL group.'
    mldsa:
      status: experimental
      scope: standalone
      since_version: null
      since_note: BoringSSL tags are date-based and its GitHub releases carry no release notes, so no
        first version can be stated.
      evidence_type: source-code
      evidence_strength: inferred
      strength_reason: mldsa.h says it implements FIPS 204 but states no support level; the README promises
        no API or ABI stability.
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/mldsa.h
      verified_on: '2026-11-11'
    slhdsa:
      status: experimental
      scope: standalone
      since_version: null
      since_note: BoringSSL tags are date-based and its GitHub releases carry no release notes, so no
        first version can be stated.
      evidence_type: source-code
      evidence_strength: inferred
      strength_reason: slhdsa.h declares only SLH-DSA-SHA2-128s and SLH-DSA-SHAKE-256f and cites FIPS
        205 only for prehash; no support level is stated.
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/slhdsa.h
      verified_on: '2026-11-11'
    hybrid_kex:
      status: experimental
      since_version: null
      since_note: BoringSSL tags are date-based and its GitHub releases carry no release notes, so no
        first version can be stated.
      evidence_type: source-code
      evidence_strength: inferred
      strength_reason: ssl.h defines the X25519MLKEM768 and MLKEM1024 groups and calls post-quantum KEMs
        'experimental'; no release notes confirm a level.
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/ssl.h
      verified_on: '2026-11-11'
- id: aws-lc
  name: AWS-LC
  kind: library
  homepage: https://github.com/aws/aws-lc
  repo: aws/aws-lc
  release_source:
    type: github_release
    repo: aws/aws-lc
  algorithms:
    mlkem:
      status: supported
      scope: standalone
      since_version: 1.35.0
      evidence_type: release-notes
      evidence_strength: stated
      evidence_url: https://github.com/aws/aws-lc/releases/tag/v1.35.0
      verified_on: '2026-11-11'
      note: 'Release note: ''ML-KEM-IPD to ML-KEM as defined in FIPS 203''.'
    mldsa:
      status: supported
      scope: standalone
      since_version: null
      since_note: PQREADME is undated; release notes name ML-DSA only as change titles, from v1.37.0 (2024-10-17).
      evidence_type: official-docs
      evidence_strength: stated
      evidence_url: https://github.com/aws/aws-lc/blob/main/crypto/fipsmodule/PQREADME.md
      verified_on: '2026-11-11'
      note: 'PQREADME lists ML-DSA as supported. Release v1.43.0 notes: ''Move ML-DSA to FIPSMODULE''.'
    slhdsa:
      status: planned
      scope: standalone
      evidence_type: issue-tracker
      evidence_strength: stated
      evidence_url: https://github.com/aws/aws-lc/issues/3305#issuecomment-4971937630
      verified_on: '2026-11-11'
      note: A maintainer (jakemas, who merges PRs in the repository) replied on 2026-07-14 that SLH-DSA
        'is on the planned roadmap'. PQREADME and all 166 release notes read name no SLH-DSA support.
        Issue aws/aws-lc#3305 is open.
    hybrid_kex:
      status: supported
      since_version: 1.35.1
      evidence_type: release-notes
      evidence_strength: stated
      evidence_url: https://github.com/aws/aws-lc/releases/tag/v1.35.1
      verified_on: '2026-11-11'
      note: 'Release note: ''Add MLKEM768 Hybrid Groups to libssl''. PQREADME lists X25519MLKEM768, SecP256r1MLKEM768,
        SecP384r1MLKEM1024.'
