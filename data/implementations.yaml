      status: supported
      scope: standalone
      since_version: '1.24'
      evidence_type: release-notes
      evidence_strength: stated
      evidence_url: https://go.dev/doc/go1.24
      verified_on: '2026-11-11'
      note: 'Go 1.24 notes: new crypto/mlkem package (ML-KEM-768 and ML-KEM-1024).'
    mldsa:
      status: supported
      scope: standalone
      since_version: '1.27'
      evidence_type: release-notes
      evidence_strength: stated
      evidence_url: https://go.dev/doc/go1.27
      verified_on: '2026-11-11'
