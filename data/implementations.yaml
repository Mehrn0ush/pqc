      status: supported
      since_version: '1.24'
      evidence_type: release-notes
      evidence_strength: stated
      evidence_url: https://go.dev/doc/go1.24
      verified_on: '2026-11-11'
      note: 'Go 1.24 notes: X25519MLKEM768 in crypto/tls, enabled by default. Go 1.26 notes add SecP256r1MLKEM768
        and SecP384r1MLKEM1024 by default.'
