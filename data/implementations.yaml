# One entry per tracked project. Every claim other than 'unverified' needs evidence_url and verified_on.
# See CONTRIBUTING.md for the evidence rule.
- id: openssl
  name: OpenSSL
  kind: library
  homepage: https://openssl-library.org/
  repo: openssl/openssl
  release_source:
    type: github_release
    repo: openssl/openssl
  algorithms:
    mlkem:
      status: supported
      since_version: 3.5.0
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'.
    mldsa:
      status: supported
      since_version: 3.5.0
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'; ML-DSA is in the default TLS signature algorithms.
    slhdsa:
      status: supported
      since_version: 3.5.0
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: Listed under 'Changes between 3.4 and 3.5.0'.
    hybrid_kex:
      status: supported
      since_version: 3.5.0
      evidence_url: https://github.com/openssl/openssl/blob/master/CHANGES.md
      verified_on: '2026-11-11'
      note: X25519MLKEM768, SecP256r1MLKEM768 and SecP384r1MLKEM1024 TLS groups; X25519MLKEM768 first
        in the default group list.
- id: boringssl
  name: BoringSSL
  kind: library
  homepage: https://boringssl.googlesource.com/boringssl/
  repo: google/boringssl
  release_source:
    type: github_release
    repo: google/boringssl
  algorithms:
    mlkem:
      status: supported
      since_version: null
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/mlkem.h
      verified_on: '2026-11-11'
      note: Public header cites FIPS 203. BoringSSL release notes were not found, so no first version
        is recorded.
    mldsa:
      status: supported
      since_version: null
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/mldsa.h
      verified_on: '2026-11-11'
      note: Public header cites FIPS 204. BoringSSL release notes were not found, so no first version
        is recorded.
    slhdsa:
      status: unverified
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/slhdsa.h
      verified_on: '2026-11-11'
      note: slhdsa.h declares SLH-DSA parameter sets but does not name FIPS 205 or a support level.
    hybrid_kex:
      status: supported
      since_version: null
      evidence_url: https://github.com/google/boringssl/blob/main/include/openssl/ssl.h
      verified_on: '2026-11-11'
      note: ssl.h defines SSL_GROUP_X25519_MLKEM768 and SSL_GROUP_MLKEM1024.
- id: aws-lc
  name: AWS-LC
  kind: library
  homepage: https://github.com/aws/aws-lc
  repo: aws/aws-lc
  release_source:
    type: github_release
    repo: aws/aws-lc
  algorithms:
    mlkem:
      status: supported
      since_version: 1.35.0
      evidence_url: https://github.com/aws/aws-lc/releases/tag/v1.35.0
      verified_on: '2026-11-11'
      note: 'Release note: ''ML-KEM-IPD to ML-KEM as defined in FIPS 203''.'
    mldsa:
      status: supported
      since_version: null
      evidence_url: https://github.com/aws/aws-lc/blob/main/crypto/fipsmodule/PQREADME.md
      verified_on: '2026-11-11'
      note: 'PQREADME lists ML-DSA as supported. Release v1.43.0 notes: ''Move ML-DSA to FIPSMODULE''.'
    slhdsa:
      status: unverified
      evidence_url: https://github.com/aws/aws-lc/blob/main/crypto/fipsmodule/PQREADME.md
      verified_on: '2026-11-11'
      note: PQREADME lists only ML-KEM and ML-DSA; no SLH-DSA statement found in release notes.
    hybrid_kex:
      status: supported
      since_version: 1.35.1
      evidence_url: https://github.com/aws/aws-lc/releases/tag/v1.35.1
      verified_on: '2026-11-11'
      note: 'Release note: ''Add MLKEM768 Hybrid Groups to libssl''. PQREADME lists X25519MLKEM768, SecP256r1MLKEM768,
        SecP384r1MLKEM1024.'
