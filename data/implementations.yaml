- id: nss
  name: NSS
  kind: library
  homepage: https://firefox-source-docs.mozilla.org/security/nss/
  repo: nss-dev/nss
  release_source:
    type: nss_release_notes
    url: https://firefox-source-docs.mozilla.org/security/nss/releases/index.html
  algorithms:
    mlkem:
      status: supported
      since_version: '3.105'
      evidence_url: https://firefox-source-docs.mozilla.org/security/nss/releases/nss_3_105.html
      verified_on: '2026-11-11'
      note: 'NSS 3.105 notes: ''support for ML-KEM-768 in softoken and pk11wrap''.'
    mldsa:
      status: unverified
      evidence_url: https://firefox-source-docs.mozilla.org/security/nss/releases/nss_3_128.html
      verified_on: '2026-11-11'
      note: Release notes list ML-DSA bugs from NSS 3.116 on but do not state a support level.
    slhdsa:
      status: unverified
      verified_on: '2026-11-11'
      note: No SLH-DSA statement found in the NSS release notes read.
    hybrid_kex:
      status: supported
      since_version: '3.105'
      evidence_url: https://firefox-source-docs.mozilla.org/security/nss/releases/nss_3_105.html
      verified_on: '2026-11-11'
      note: 'NSS 3.105 notes: ''libssl support for mlkem768x25519''. NSS 3.118 notes: ''Make mlkem768x25519
        the default''.'
- id: openssh
  name: OpenSSH
  kind: protocol tool
  homepage: https://www.openssh.org/
  repo: openssh/openssh-portable
  release_source:
    type: github_tags
    repo: openssh/openssh-portable
    prefix: V_
    tag_regex: ^V_(\d+)_(\d+)_P(\d+)$
  algorithms:
    mlkem:
      status: supported
      since_version: '9.9'
      evidence_url: https://www.openssh.org/releasenotes.html
      verified_on: '2026-11-11'
      note: OpenSSH 9.9 added mlkem768x25519-sha256 (ML-KEM with X25519). ML-KEM is used only inside this
        hybrid.
    mldsa:
      status: supported
      since_version: '10.6'
      evidence_url: https://www.openssh.org/releasenotes.html
      verified_on: '2026-11-11'
      note: OpenSSH 10.6 enabled ssh-mldsa44-ed25519, a hybrid ML-DSA/Ed25519 scheme from an IETF draft;
        experimental since 10.4. No standalone ML-DSA.
    slhdsa:
      status: unverified
      verified_on: '2026-11-11'
      note: No SLH-DSA statement found in the OpenSSH release notes read.
    hybrid_kex:
      status: supported
      since_version: '9.9'
      evidence_url: https://www.openssh.org/releasenotes.html
      verified_on: '2026-11-11'
      note: SSH key exchange mlkem768x25519-sha256, default since OpenSSH 10.0. This is SSH, not TLS.
