name: Collect

# Daily detection of upstream change. Writes facts only (data/snapshots, data/changelog.json) and opens
# "review-needed" issues. It never edits data/implementations.yaml or data/standards.yaml: a person decides
# what a new release means. On any failure the last good snapshot is kept and the workflow fails.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every collector and print the diff; commit nothing and open no issues"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect releases and drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # push-with-retry.sh rebases onto the latest main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Collect (fails closed)
        run: pqc-tracker collect --entries-out "$RUNNER_TEMP/new-entries.json"

      - name: Dry run, show what would change
        if: inputs.dry_run
        run: |
          set -euo pipefail
          echo "## Dry run: nothing is committed and no issues are opened" | tee -a "$GITHUB_STEP_SUMMARY"
          git status --short data
          git --no-pager diff --stat -- data
          git --no-pager diff -- data
          echo "New changelog entries:"
          cat "$RUNNER_TEMP/new-entries.json"
          pqc-tracker issues --dry-run --repo "$GITHUB_REPOSITORY" --entries "$RUNNER_TEMP/new-entries.json"

      - name: Open review-needed issues
        if: ${{ !inputs.dry_run }}
        run: pqc-tracker issues --repo "$GITHUB_REPOSITORY" --entries "$RUNNER_TEMP/new-entries.json"

      - name: Commit collected data
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/latest.json data/changelog.json data/collection-status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: collect $(date -u +%Y-%m-%d)"
            .github/scripts/push-with-retry.sh main
          fi

      - name: Record failure and keep last good snapshot
        if: failure() && !inputs.dry_run
        run: |
          set -euo pipefail
          git checkout -- data/snapshots data/changelog.json
          pqc-tracker record-failure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record failed collection $(date -u +%Y-%m-%d)"
            .github/scripts/push-with-retry.sh main
          fi
