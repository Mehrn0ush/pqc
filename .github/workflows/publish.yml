name: Publish

# Builds the static site from main and deploys it with the official Pages actions.
# Runs on push to main and after every completed Collect run: a failed Collect also publishes, so
# the site shows the "data stale since" notice while keeping the last good snapshot.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Collect]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # The changelog's confirmed status changes are derived from the git history of the YAML files.
          fetch-depth: 0

      - name: Record the commit being built
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate schemas
        run: pqc-tracker validate

      # A Publish started by Collect has not changed any code. When nothing outside data/ differs from the
      # commit that is live, skip the unit tests (data validation, the build and the smoke test still run).
      # Every other trigger, and any doubt, runs them. The decision lives in publish-gate.sh so it can be tested.
      - name: Decide whether the unit tests are needed
        id: gate
        run: .github/scripts/publish-gate.sh "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.gate.outputs.run_tests == 'true'
        run: python -m unittest discover -s tests

      - name: Build site
        run: pqc-tracker build --out dist/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    name: Check the live site serves this build
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Download the artifact that was deployed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: deployed

      - name: Unpack it
        run: mkdir expected && tar -xf deployed/artifact.tar -C expected

      - name: Compare the live site with the build (retries for up to five minutes)
        run: pqc-tracker smoke-test --site-dir expected --url https://pqc.silastron.com --timeout 300 --interval 15
